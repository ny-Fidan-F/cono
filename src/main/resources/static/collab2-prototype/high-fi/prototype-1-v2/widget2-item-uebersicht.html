<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Widget 2 · Item-Übersicht · Prototype 1 V2</title>
    <link rel="stylesheet" href="styles.css">
    <script src="widget2.js" defer></script>
</head>
<body>
    <main class="widget widget--overview" id="widget2" aria-label="Widget 2: Item-Übersicht" data-widget-width="330" data-widget-height="260">
        <header class="overview-header">
            <h1>Item-Übersicht</h1>
            <span class="column-title">WERT</span>
            <span class="column-title column-title--status">STATUS</span>
        </header>
        <ol class="item-list">
            <li class="item-row item-row--active" data-item-row="0">
                <span class="item-marker" aria-hidden="true">A</span>
                <div class="item-description"><span class="item-name">Item A</span><span class="item-duration"><span data-overview-elapsed>7.0</span> / 15 min</span></div>
                <strong class="item-value" data-overview-value="0">38.5</strong>
                <span class="item-status item-status--active"><span class="status-dot" aria-hidden="true"></span>AKTUELL</span>
            </li>
            <li class="item-row" data-item-row="1">
                <span class="item-marker item-marker--next" aria-hidden="true">B</span>
                <span class="item-name">Item B</span>
                <strong class="item-value">12</strong>
                <span class="item-status item-status--next"><span class="status-dot" aria-hidden="true"></span>ALS NÄCHSTES</span>
            </li>
            <li class="item-row" data-item-row="2">
                <span class="item-marker item-marker--waiting" aria-hidden="true">C</span>
                <span class="item-name">Item C</span>
                <strong class="item-value">0</strong>
                <span class="item-status item-status--waiting"><span class="status-dot" aria-hidden="true"></span>WARTET</span>
            </li>
            <li class="item-row" data-item-row="3">
                <span class="item-marker item-marker--waiting" aria-hidden="true">D</span>
                <span class="item-name">Item D</span>
                <strong class="item-value">4.5</strong>
                <span class="item-status item-status--waiting"><span class="status-dot" aria-hidden="true"></span>WARTET</span>
            </li>
        </ol>
    </main>
</body>
</html>
