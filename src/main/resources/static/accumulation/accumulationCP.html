<!DOCTYPE html>
<html>
<head>
    <link href="accumulationCP.css" rel="stylesheet">
    <title>Accumulation Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="/webjars/sockjs-client/sockjs.min.js"></script>
    <script src="/webjars/stomp-websocket/stomp.min.js"></script>
    <script src="/webjars/jquery/jquery.min.js"></script>
    <script src="../utils/Backend.js"></script>
    <script src="accumulationStorage.js"></script>
    <script src="accumulationCP.js"></script>
</head>
<body class="p-3">
    <h3>Accumulation Dashboard</h3>
    <button id="addItem" class="btn btn-secondary">+ Item</button>
    <table class="table">
        <thead>
            <tr><th>Name</th><th>Dauer (Min)</th><th>Sample alle (Min)</th><th>Startmenge</th><th>Grundrate</th><th>Teiler</th><th></th></tr>
        </thead>
        <tbody id="items"></tbody>
    </table>
    <div class="mb-3">
        <button id="start" class="btn btn-start">Start</button>
        <button id="pause" class="btn">Pause</button>
        <button id="reset" class="btn btn-reset">Zurücksetzen</button>
        <span id="status"></span>
    </div>
</body>
</html>
